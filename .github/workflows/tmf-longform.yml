name: TMF Long-Form Auto-Post

# Runs Mon/Wed/Fri at 9 AM CT (14:00 UTC CDT)
# Generates, renders, and uploads a PRIVATE 8–10 min YouTube video for The Mind Files.
# Matt receives an email with the YouTube Studio review link.
# He manually reviews and publishes / schedules.

on:
  schedule:
    - cron: '0 14 * * 1'   # Monday    9 AM CT
    - cron: '0 14 * * 3'   # Wednesday 9 AM CT
    - cron: '0 14 * * 5'   # Friday    9 AM CT
  workflow_dispatch:
    inputs:
      topic:
        description: 'Override topic string (leave blank for auto-pick)'
        required: false
        default: ''
      dry_run:
        description: 'Render only, skip upload (true/false)'
        required: false
        default: 'false'

jobs:
  longform-tmf:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          # Install Oswald Bold for thumbnails (with fallback)
          sudo mkdir -p /usr/local/share/fonts
          curl -sL --retry 3 --max-time 30 \
            "https://fonts.gstatic.com/s/oswald/v53/TK3_WkUHHAIjg75cFRf3bXL8LICs13NvgUFoZAaRliE.ttf" \
            -o /usr/local/share/fonts/Oswald-Bold.ttf || echo "Font download failed — will use fallback font"
          fc-cache -f || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts Pillow openai anthropic requests \
            google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Create YouTube token file
        run: |
          echo '${{ secrets.YT_TOKEN_TMF }}' > youtube_token_tmf.json

      - name: Run TMF Long-Form auto-post
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_SHEETS_KEY:  ${{ secrets.GOOGLE_SHEETS_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TMF_LONGFORM_VOICE: ${{ vars.TMF_LONGFORM_VOICE || 'en-US-GuyNeural' }}
          TMF_LONGFORM_PLAYLIST_ID: ${{ vars.TMF_LONGFORM_PLAYLIST_ID || '' }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            ARGS="--topic \"${{ github.event.inputs.topic }}\""
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: python3 auto_post_tmf_longform.py $ARGS"
          eval "python3 auto_post_tmf_longform.py $ARGS"

      - name: Commit dedup log + post log
        run: |
          git config --local user.email "automation@youtube.local"
          git config --local user.name "YouTube AutoPost Bot"
          git pull --rebase origin main || true
          git add auto_post_log.json pexels_used_tmf_longform.json tmf_longform_queue.json 2>/dev/null || true
          git commit -m "TMF long-form post - $(date)" || true
          git push || true

      - name: Upload logs to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmf-longform-logs
          path: |
            auto_post_log.json
          retention-days: 14
