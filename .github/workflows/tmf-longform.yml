name: TMF Long-Form Auto-Post

# Runs Mon/Wed/Fri at 9 AM CT (14:00 UTC CDT)
# Generates, renders, and uploads a PRIVATE 8–10 min YouTube video for The Mind Files.
# Matt receives an email with the YouTube Studio review link.
# He manually reviews and publishes / schedules.

on:
  schedule:
    - cron: '0 15 * * 0'→ Runs at 15:00, only on Sunday   # Sunday    10 AM CT
    - cron: '0 14 * * 2'→ Runs at 14:00, only on Tuesday   # Tuesday    9 AM CT
    - cron: '0 17 * * 5'→ Runs at 17:00, only on Friday   # Friday    12 PM CT
  workflow_dispatch:
    inputs:
      topic:
        description: 'Override topic string (leave blank for auto-pick)'
        required: false
        default: ''
      dry_run:
        description: 'Render only, skip upload (true/false)'
        required: false
        default: 'false'

jobs:
  longform-tmf:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
