name: YouTube Auto-Post - Bible Story Garden

on:
  schedule:
    # 12 PM CDT = 17:00 UTC  (family audience: afternoon scroll window)
    # Cadence cut Jul 5 2026: dropped 7PM slot -- this workflow is now the ONLY
    # BSG poster (youtube-autopost.yml's BSG job disabled same day -- it was
    # duplicate-posting alongside this file, ~21/wk combined vs 7/wk expected).
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  autopost-bsg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 80
    steps:
      - name: Anti-repetition jitter (schedule only)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 1200))
          echo "Jitter: sleeping ${DELAY}s (max 20 min; watchdog retry window is T+60)"
          sleep $DELAY

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask "edge-tts==7.2.8" Pillow openai google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests

      - name: Create YouTube token files
        run: |
          echo '${{ secrets.YT_TOKEN_BSG }}' > youtube_token_bsg.json

      - name: Run Bible Story Garden auto-post
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
        run: python3 auto_post.py --channel bsg
        # continue-on-error removed Aug 24 2026: it absorbed every
        # sys.exit(1) in auto_post.py, so a day with no video looked
        # identical to a successful one.

      - name: Find video file
        id: findvideo
        run: |
          MP4=$(find . -name "*.mp4" -newer youtube_token_bsg.json 2>/dev/null | grep -i BSG_Output | head -1)
          if [ -z "$MP4" ]; then
            MP4=$(find BSG_Output -name "*.mp4" 2>/dev/null | head -1)
          fi
          echo "Newest BSG mp4: $MP4"
          echo "FB_VIDEO_PATH=$MP4" >> $GITHUB_ENV

      - name: Post Facebook video (BSG)
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN_BSG }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID_BSG }}
          FB_POST_LOG: "bsg_post_log.json"
        run: |
          pip install requests -q
          python3 fb_yt_crosspost.py
        continue-on-error: true

      - name: Commit results
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --local user.email "automation@youtube.local"
          git config --local user.name "YouTube AutoPost Bot"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/midwestmade4u-prog/youtube-autopost.git
          git add bsg_post_log.json auto_post_log.json auto_trigger_bsg_*.json 2>/dev/null || true
          git diff --cached --quiet && echo "Nothing to commit, skipping" && exit 0
          # Fixed Jul 19 2026: previously ran `git pull --rebase` BEFORE this
          # commit, while the dedup-log files were still uncommitted/dirty from
          # the auto-post run above. If origin had moved (e.g. an overlapping
          # run), that pull silently failed (`|| true`) leaving this commit
          # based on a stale HEAD, so the final `git push` was rejected
          # (non-fast-forward) and the dedup-log write never reached
          # origin/main -- the topic looked "unused" again on the next run.
          # Now: commit locally first (so a real rebase has something to
          # replay), then retry pull+push so a genuine race resolves instead
          # of getting silently dropped.
          git commit -m "Auto-post log (BSG) - $(date)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed dedup-log commit on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent run) -- retrying"
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 15) + 5 ))
          done
          echo "::error::BSG dedup-log commit FAILED to push after 5 attempts -- this run's post will NOT be recorded and may repeat."
          exit 1

      - name: Upload logs to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsg-autopost-logs
          path: |
            watcher.log
            auto_post_log.json
            video_server.log
          retention-days: 7
