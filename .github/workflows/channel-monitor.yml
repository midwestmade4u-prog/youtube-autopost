name: Channel Monitor — Daily Health Check

on:
  schedule:
    # 2 AM CT = 7:00 UTC (CDT)
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print report but skip email'
        required: false
        default: 'false'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests anthropic google-api-python-client \
            google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Write YouTube token files
        run: |
          echo '${{ secrets.YT_TOKEN_TMF }}' > youtube_token_tmf.json
          echo '${{ secrets.YT_TOKEN_BSG }}' > youtube_token_bsg.json
          echo '${{ secrets.YT_TOKEN_MZ }}'  > youtube_token_mz.json

      - name: Run channel monitor
        env:
          GOOGLE_SHEETS_KEY:          ${{ secrets.GOOGLE_SHEETS_KEY }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD:         ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN:               ${{ secrets.GH_PAT }}
          FB_PAGE_ACCESS_TOKEN_TMF:   ${{ secrets.FB_PAGE_ACCESS_TOKEN_TMF }}
          FB_PAGE_ID_TMF:             ${{ secrets.FB_PAGE_ID_TMF }}
          FB_PAGE_ACCESS_TOKEN_MZ:    ${{ secrets.FB_PAGE_ACCESS_TOKEN_MZ }}
          FB_PAGE_ID_MZ:              ${{ secrets.FB_PAGE_ID_MZ }}
          FB_PAGE_ACCESS_TOKEN_BSG:   ${{ secrets.FB_PAGE_ACCESS_TOKEN_BSG }}
          FB_PAGE_ID_BSG:             ${{ secrets.FB_PAGE_ID_BSG }}
        run: python3 channel_monitor.py
        continue-on-error: true

      - name: Commit longform queues + post logs
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f \
            tmf_longform_queue.json \
            mz_longform_queue.json \
            bsg_longform_queue.json \
            tmf_post_log.json \
            mz_post_log.json \
            bsg_post_log.json \
            tmf_longform_posted.json \
            mz_longform_posted.json \
            bsg_longform_posted.json 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore: channel monitor — update longform queues + logs [skip ci]"
          # Aug 29 2026: this was a bare `git push origin HEAD:main || true` with
          # no credentials, so the monitor's queue and log updates silently never
          # reached main. Authenticate, and fail loudly rather than pretending.
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/midwestmade4u-prog/youtube-autopost.git
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Channel-monitor state pushed on attempt $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "::error::channel-monitor FAILED to push queue/log updates after 3 attempts."
          exit 1

      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log
          path: channel_monitor.py
          retention-days: 7
