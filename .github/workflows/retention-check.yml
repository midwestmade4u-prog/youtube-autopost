name: Shorts Retention Check

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days'
        required: false
        default: '14'
  schedule:
    - cron: '0 13 * * 0'

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Write YouTube token files
        run: |
          echo '${{ secrets.YT_TOKEN_TMF }}' > youtube_token_tmf.json
          echo '${{ secrets.YT_TOKEN_BSG }}' > youtube_token_bsg.json
          echo '${{ secrets.YT_TOKEN_MZ }}'  > youtube_token_mz.json

      - name: Run retention check
        run: python3 check_shorts_retention.py --days ${{ github.event.inputs.days || '14' }}
