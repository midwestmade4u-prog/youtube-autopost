name: BSG Watchdog — YouTube API Verification + Auto-Retry

# Replaces log-file check with direct YouTube API call (ground truth).
# Fixes: was checking wrong workflow (youtube-autopost.yml) at wrong time (4PM).
# Correct: bsg-autopost.yml fires at noon + 7PM CDT.
# T+60min: no video found → auto-retry workflow
# T+120min: still no video → diagnose + alert Matt with exact next step
#
# BSG shorts slots (UTC): 17:00 (noon CDT) + 00:00 (7PM CDT)

# RETIRED 2026-08-30 -- there is nothing left to watch. Removing this matters:
# left running it would email an alert every single day for a channel that is
# deliberately not posting. To resume, restore:
#   schedule:
#     - cron: '0 18 * * *'    # T+60min  → retry
#     - cron: '0 19 * * *'    # T+120min → alert
#     - cron: '0 1 * * *'     # T+60min  → retry
#     - cron: '0 2 * * *'     # T+120min → alert
on:
  workflow_dispatch:
    inputs:
      check_type:
        description: 'Force check type: retry or alert'
        required: false
        default: ''
      slot_utc:
        description: 'Force slot UTC hour (17 or 0)'
        required: false
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth google-auth-oauthlib google-api-python-client --quiet

      - name: Write BSG token
        run: echo '${{ secrets.YT_TOKEN_BSG }}' > youtube_token_bsg.json

      - name: Detect window
        id: window
        run: |
          python3 << 'PYEOF'
          import os
          from datetime import datetime

          now  = datetime.utcnow()
          hour = now.hour

          force_type = os.environ.get("FORCE_TYPE", "").strip()
          force_slot = os.environ.get("FORCE_SLOT", "").strip()

          if force_type and force_slot:
              check_type = force_type
              slot_utc   = int(force_slot)
          else:
              mapping = {
                  18: ("retry", 17),
                  19: ("alert", 17),
                   1: ("retry",  0),
                   2: ("alert",  0),
              }
              if hour in mapping:
                  check_type, slot_utc = mapping[hour]
              else:
                  print(f"⏰ Hour {hour} UTC — not a BSG watchdog window, skipping")
                  check_type, slot_utc = "skip", 0

          out = os.environ.get("GITHUB_OUTPUT", "/dev/stdout")
          with open(out, "a") as f:
              f.write(f"check_type={check_type}\n")
              f.write(f"slot_utc={slot_utc}\n")
          print(f"check_type={check_type} slot_utc={slot_utc}")
          PYEOF
        env:
          FORCE_TYPE: ${{ github.event.inputs.check_type }}
          FORCE_SLOT: ${{ github.event.inputs.slot_utc }}

      - name: Run watchdog
        if: steps.window.outputs.check_type != 'skip'
        run: |
          python3 unified_watchdog.py \
            --channel bsg \
            --slot-utc ${{ steps.window.outputs.slot_utc }} \
            --post-type shorts \
            --check-type ${{ steps.window.outputs.check_type }}
        env:
          GH_PAT:             ${{ secrets.GH_PAT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
