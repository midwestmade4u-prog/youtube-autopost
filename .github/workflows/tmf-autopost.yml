name: YouTube Auto-Post - The Mind Files

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  autopost-tmf:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask edge-tts Pillow openai google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests

      - name: Create YouTube token files
        run: |
          echo '${{ secrets.YT_TOKEN_TMF }}' > youtube_token_tmf.json

      - name: Run The Mind Files auto-post
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
        run: python3 auto_post.py --channel tmf
        continue-on-error: true

      - name: Cross-post to Facebook Page (TMF)
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN_TMF }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID_TMF }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess, sys
          log_file = "tmf_post_log.json"
          if not os.path.exists(log_file):
              print("No post log found, skipping FB cross-post")
              sys.exit(0)
          with open(log_file) as f:
              data = json.load(f)
          posts = data if isinstance(data, list) else data.get("posts", [])
          last = next((p for p in reversed(posts) if p.get("url")), None)
          if not last:
              print("No recent post with URL, skipping")
              sys.exit(0)
          m = re.search(r"youtu\.be/([A-Za-z0-9_-]+)|v=([A-Za-z0-9_-]+)", last["url"])
          if not m:
              print("Could not parse video ID, skipping")
              sys.exit(0)
          env = os.environ.copy()
          env["YT_VIDEO_ID"] = m.group(1) or m.group(2)
          env["YT_VIDEO_TITLE"] = last.get("title", "New video")
          env["YT_CHANNEL_HANDLE"] = "@TheMindFilesYT"
          subprocess.run(["python3", "fb_yt_crosspost.py"], env=env, check=False)
          PYEOF
        continue-on-error: true

      - name: Commit results
        run: |
          git config --local user.email "automation@youtube.local"
          git config --local user.name "YouTube AutoPost Bot"
          git pull --rebase origin main || true
          git add tmf_post_log.json auto_post_log.json auto_trigger_tmf_*.json 2>/dev/null || true
          git commit -m "Auto-post videos (TMF) - $(date)" || true
          git push || true

      - name: Upload logs to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmf-autopost-logs
          path: |
            watcher.log
            auto_post_log.json
            video_server.log
          retention-days: 7
