name: YouTube Auto-Post - The Mind Files

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  autopost-tmf:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask edge-tts Pillow openai google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests

      - name: Create YouTube token files
        run: |
          echo '${{ secrets.YT_TOKEN_TMF }}' > youtube_token_tmf.json

      - name: Run The Mind Files auto-post
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
        run: python3 auto_post.py --channel tmf
        continue-on-error: true

      - name: Find video file and set path
        id: findvideo
        run: |
          echo "=== All mp4 files in workspace ==="
          find . -name "*.mp4" 2>/dev/null || echo "none found in root"
          find /tmp -name "*.mp4" 2>/dev/null | head -5 || true
          find /home/runner -name "*.mp4" 2>/dev/null | head -5 || true
          # Set the newest mp4 as env var for next step
          MP4=$(find . /tmp /home/runner -name "*.mp4" 2>/dev/null | xargs ls -t 2>/dev/null | head -1)
          echo "Newest mp4: $MP4"
          echo "FB_VIDEO_PATH=$MP4" >> $GITHUB_ENV

      - name: Post Facebook Reel (TMF)
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN_TMF }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID_TMF }}
          FB_TRIGGER_GLOB: "auto_trigger_tmf_*.json"
        run: |
          pip install requests -q
          python3 fb_yt_crosspost.py
        continue-on-error: true

      - name: Commit results
        run: |
          git config --local user.email "automation@youtube.local"
          git config --local user.name "YouTube AutoPost Bot"
          git pull --rebase origin main || true
          git add tmf_post_log.json auto_post_log.json auto_trigger_tmf_*.json 2>/dev/null || true
          git commit -m "Auto-post videos (TMF) - $(date)" || true
          git push || true

      - name: Upload logs to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmf-autopost-logs
          path: |
            watcher.log
            auto_post_log.json
            video_server.log
          retention-days: 7
