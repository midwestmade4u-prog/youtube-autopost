name: YouTube Auto-Post - The Mind Files

on:
  schedule:
    # Jul 5 2026: 1x/day, every day (7/wk) -- Matt wants a daily-minimum floor
    # per channel. Dropped the 2nd/evening slot (was 14/wk) but kept full 7-day
    # coverage rather than the analytics-review's suggested Mon-Sat/6-wk cut.
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  autopost-tmf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask "edge-tts==7.2.8" Pillow openai google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests

      - name: Create YouTube token files
        run: |
          echo '${{ secrets.YT_TOKEN_TMF }}' > youtube_token_tmf.json

      - name: Run The Mind Files auto-post
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
        run: python3 auto_post.py --channel tmf
        continue-on-error: true

      - name: Find video file
        id: findvideo
        run: |
          MP4=$(find . -name "*.mp4" -newer youtube_token_tmf.json 2>/dev/null | grep -i TMF_Output | head -1)
          if [ -z "$MP4" ]; then
            MP4=$(find TMF_Output -name "*.mp4" 2>/dev/null | head -1)
          fi
          if [ -z "$MP4" ] || [ ! -f "$MP4" ]; then
            echo "No MP4 found — skipping FB upload"
            echo "FB_VIDEO_PATH=" >> $GITHUB_ENV
          else
            echo "Newest TMF mp4: $MP4"
            echo "FB_VIDEO_PATH=$MP4" >> $GITHUB_ENV
          fi

      - name: Post Facebook video (TMF)
        if: env.FB_VIDEO_PATH != ''
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN_TMF }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID_TMF }}
          FB_POST_LOG: "tmf_post_log.json"
        run: |
          pip install requests -q
          python3 fb_yt_crosspost.py
        continue-on-error: true

      - name: Commit results
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --local user.email "automation@youtube.local"
          git config --local user.name "YouTube AutoPost Bot"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/midwestmade4u-prog/youtube-autopost.git
          git add tmf_post_log.json auto_post_log.json auto_trigger_tmf_*.json 2>/dev/null || true
          git diff --cached --quiet && echo "Nothing to commit, skipping" && exit 0
          # Fixed Jul 19 2026: previously ran `git pull --rebase` BEFORE this
          # commit, while tmf_post_log.json was still uncommitted/dirty from
          # the auto-post run above. If origin had moved (e.g. TMF's own long
          # runtime bleeding into MZ's start time), that pull silently failed
          # (`|| true`), the commit landed on a stale HEAD, and the final
          # `git push` was rejected (non-fast-forward) -- losing this run's
          # dedup-log write entirely (matches the confirmed byte-identical
          # title repost from the Jul 19 2026 weekly review). Now: commit
          # locally first, then retry pull+push so a real race resolves
          # instead of silently vanishing.
          git commit -m "Auto-post log (TMF) - $(date)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed dedup-log commit on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent run) -- retrying"
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 15) + 5 ))
          done
          echo "::error::TMF dedup-log commit FAILED to push after 5 attempts -- this run's post will NOT be recorded and may repeat."
          exit 1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmf-autopost-logs
          path: |
            auto_post_log.json
            video_server.log
          retention-days: 7
