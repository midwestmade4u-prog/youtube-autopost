name: MZ Watchdog — YouTube API Verification + Auto-Retry

# Replaces log-file check with direct YouTube API call (ground truth).
# T+60min: no video found → auto-retry workflow
# T+120min: still no video → diagnose + alert Matt with exact next step
#
# MZ shorts slots (UTC): 14:00 + 00:00

on:
  schedule:
    # ── SHORTS: 9 AM CDT slot (14:00 UTC) ─────────────────────────────────
    - cron: '0 15 * * *'    # T+60min  → retry
    - cron: '0 16 * * *'    # T+120min → alert
    # ── SHORTS: 7 PM CDT slot (00:00 UTC) ─────────────────────────────────
    - cron: '0 1 * * *'     # T+60min  → retry
    - cron: '0 2 * * *'     # T+120min → alert
  workflow_dispatch:
    inputs:
      check_type:
        description: 'Force check type: retry or alert'
        required: false
        default: ''
      slot_utc:
        description: 'Force slot UTC hour (14 or 0)'
        required: false
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth google-auth-oauthlib google-api-python-client --quiet

      - name: Write MZ token
        run: echo '${{ secrets.YT_TOKEN_MZ }}' > youtube_token_mz.json

      - name: Detect window
        id: window
        run: |
          python3 << 'PYEOF'
          import os
          from datetime import datetime

          now  = datetime.utcnow()
          hour = now.hour

          force_type = os.environ.get("FORCE_TYPE", "").strip()
          force_slot = os.environ.get("FORCE_SLOT", "").strip()

          if force_type and force_slot:
              check_type = force_type
              slot_utc   = int(force_slot)
          else:
              mapping = {
                  15: ("retry", 14),
                  16: ("alert", 14),
                   1: ("retry",  0),
                   2: ("alert",  0),
              }
              if hour in mapping:
                  check_type, slot_utc = mapping[hour]
              else:
                  print(f"⏰ Hour {hour} UTC — not an MZ watchdog window, skipping")
                  check_type, slot_utc = "skip", 0

          out = os.environ.get("GITHUB_OUTPUT", "/dev/stdout")
          with open(out, "a") as f:
              f.write(f"check_type={check_type}\n")
              f.write(f"slot_utc={slot_utc}\n")
          print(f"check_type={check_type} slot_utc={slot_utc}")
          PYEOF
        env:
          FORCE_TYPE: ${{ github.event.inputs.check_type }}
          FORCE_SLOT: ${{ github.event.inputs.slot_utc }}

      - name: Run watchdog
        if: steps.window.outputs.check_type != 'skip'
        run: |
          python3 unified_watchdog.py \
            --channel mz \
            --slot-utc ${{ steps.window.outputs.slot_utc }} \
            --post-type shorts \
            --check-type ${{ steps.window.outputs.check_type }}
        env:
          GH_PAT:             ${{ secrets.GH_PAT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
