name: Bootstrap FB Secrets (run once)

on:
  workflow_dispatch:
    inputs:
      fb_user_token:
        description: 'Facebook User Access Token (from Graph API Explorer)'
        required: true

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Derive page tokens and set all FB secrets
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          FB_USER_TOKEN: ${{ github.event.inputs.fb_user_token }}
        run: |
          pip install PyNaCl requests -q
          python3 << 'PYEOF'
          import base64, json, os, requests
          from nacl.public import PublicKey, SealedBox

          PAT          = os.environ["GH_PAT"]
          USER_TOKEN   = os.environ["FB_USER_TOKEN"]
          REPO         = "midwestmade4u-prog/youtube-autopost"
          GH_HEADERS   = {"Authorization": f"token {PAT}", "Content-Type": "application/json"}
          FB_BASE      = "https://graph.facebook.com/v25.0"

          # Page IDs (confirmed from Graph API Explorer Jun 5 2026)
          PAGES = {
              "TMF": "1216820974847415",
              "MZ":  "1183809611475432",
          }

          # Get GH repo public key for encryption
          r = requests.get(f"https://api.github.com/repos/{REPO}/actions/secrets/public-key", headers=GH_HEADERS)
          key_data   = r.json()
          pub_key    = base64.b64decode(key_data["key"])
          key_id     = key_data["key_id"]
          print(f"GH key_id: {key_id}")

          def encrypt(value):
              box = SealedBox(PublicKey(pub_key))
              return base64.b64encode(box.encrypt(value.encode())).decode()

          def set_secret(name, value):
              resp = requests.put(
                  f"https://api.github.com/repos/{REPO}/actions/secrets/{name}",
                  headers=GH_HEADERS,
                  json={"encrypted_value": encrypt(value), "key_id": key_id}
              )
              status = "OK" if resp.status_code in (201, 204) else f"FAIL {resp.status_code}"
              print(f"  {name}: {status}")

          # Derive page tokens from user token
          for label, page_id in PAGES.items():
              r = requests.get(f"{FB_BASE}/{page_id}?fields=name,access_token&access_token={USER_TOKEN}")
              d = r.json()
              if "error" in d:
                  print(f"  ERROR getting {label} page token: {d['error']['message']}")
                  continue
              page_token = d["access_token"]
              page_name  = d.get("name", label)
              print(f"  Got token for {page_name} ({page_id})")
              set_secret(f"FB_PAGE_ACCESS_TOKEN_{label}", page_token)
              set_secret(f"FB_PAGE_ID_{label}", page_id)

          print("Done!")
          PYEOF
