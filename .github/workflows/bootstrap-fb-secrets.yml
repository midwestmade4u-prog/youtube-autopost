name: Bootstrap FB Secrets (run once per new page)

on:
  workflow_dispatch:
    inputs:
      fb_user_token:
        description: 'Facebook User Access Token (from Graph API Explorer — select ALL pages)'
        required: true

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Derive page tokens and set all FB secrets
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          FB_USER_TOKEN: ${{ github.event.inputs.fb_user_token }}
        run: |
          pip install PyNaCl requests -q
          python3 << 'PYEOF'
          import base64, json, os, requests
          from nacl.public import PublicKey, SealedBox

          PAT        = os.environ["GH_PAT"]
          USER_TOKEN = os.environ["FB_USER_TOKEN"]
          REPO       = "midwestmade4u-prog/youtube-autopost"
          GH_HEADERS = {"Authorization": f"token {PAT}", "Content-Type": "application/json"}

          # Map Facebook page names to GH secret prefixes
          # Add new channel pages here as you create them
          PAGE_MAP = {
              "The Mind Files":     "TMF",
              "Minute Zero":        "MZ",
              "Bible Story Garden": "BSG",
              "ChannelStack":       "CS",
          }

          # Get GH repo public key for encryption
          r = requests.get(f"https://api.github.com/repos/{REPO}/actions/secrets/public-key", headers=GH_HEADERS)
          key_data = r.json()
          pub_key  = base64.b64decode(key_data["key"])
          key_id   = key_data["key_id"]
          print(f"GH key_id: {key_id}")

          def encrypt(value):
              box = SealedBox(PublicKey(pub_key))
              return base64.b64encode(box.encrypt(value.encode())).decode()

          def set_secret(name, value):
              resp = requests.put(
                  f"https://api.github.com/repos/{REPO}/actions/secrets/{name}",
                  headers=GH_HEADERS,
                  json={"encrypted_value": encrypt(value), "key_id": key_id}
              )
              status = "OK" if resp.status_code in (201, 204) else f"FAIL {resp.status_code} {resp.text}"
              print(f"  {name}: {status}")

          # Fetch all pages the user token has access to (auto-discovers page IDs)
          resp = requests.get(
              "https://graph.facebook.com/v25.0/me/accounts",
              params={
                  "fields": "id,name,access_token",
                  "access_token": USER_TOKEN,
                  "limit": 20,
              }
          )
          if not resp.ok:
              print(f"ERROR /me/accounts failed: {resp.status_code} {resp.text}")
              exit(1)

          pages = resp.json().get("data", [])
          print(f"\nFound {len(pages)} page(s):")
          for p in pages:
              print(f"  - {p['name']} (id={p['id']})")

          print("\nSetting secrets:")
          found = []
          for page in pages:
              name   = page["name"]
              pid    = page["id"]
              token  = page["access_token"]
              prefix = PAGE_MAP.get(name)
              if prefix:
                  set_secret(f"FB_PAGE_ACCESS_TOKEN_{prefix}", token)
                  set_secret(f"FB_PAGE_ID_{prefix}", pid)
                  found.append(f"{name} ({prefix})")
              else:
                  print(f"  WARNING: Unrecognized page '{name}' - add to PAGE_MAP if needed")

          print(f"\nDone! Set secrets for: {', '.join(found) if found else 'none matched'}")
          print("Tokens are long-lived (~60 days). Re-run this workflow before they expire.")
          PYEOF
