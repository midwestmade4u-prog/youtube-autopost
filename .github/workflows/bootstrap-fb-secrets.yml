name: Bootstrap FB Secrets (run once)

on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Install PyNaCl
        run: pip install PyNaCl requests

      - name: Set FB secrets for TMF and MZ
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 << 'PYEOF'
          import base64, json, os, requests
          from nacl.public import PublicKey, SealedBox

          PAT = os.environ["GH_PAT"]
          REPO = "midwestmade4u-prog/youtube-autopost"
          HEADERS = {"Authorization": f"token {PAT}", "Content-Type": "application/json"}

          r = requests.get(f"https://api.github.com/repos/{REPO}/actions/secrets/public-key", headers=HEADERS)
          key_data = r.json()
          pub_key_bytes = base64.b64decode(key_data["key"])
          key_id = key_data["key_id"]
          print(f"key_id: {key_id}")

          def set_secret(name, value):
              box = SealedBox(PublicKey(pub_key_bytes))
              encrypted = base64.b64encode(box.encrypt(value.encode())).decode()
              resp = requests.put(
                  f"https://api.github.com/repos/{REPO}/actions/secrets/{name}",
                  headers=HEADERS,
                  json={"encrypted_value": encrypted, "key_id": key_id}
              )
              status = "OK" if resp.status_code in (201, 204) else f"FAIL {resp.status_code} {resp.text}"
              print(f"{name}: {status}")

          set_secret("FB_PAGE_ACCESS_TOKEN_TMF", "EAAXbI32B6G4BRt7u2Mgz0rn1WaKWsL7ZCwJe4TFajkXcveitD6TSx3ZBMgQzoQSBvsF4MsyyjnWOqOLG2TZCkHIqbl8tZBm2muIh2F1RtB2GvYmy4nvJmFDsYMmFsYhgV8HUJwUqIZAONWkELnvlMBdzRrXk8c4QIZB9lg0pZAfHFN1EzbZAJKBiFJtj3j35bz6UV7LUFYiZANlcCQ3CeG87C9GnMBLNCKPw4HUDe9h8S8pfvYWVNN23LEzZCBbKgX8yRRY8i48Y0kupcYvgAZD")
          set_secret("FB_PAGE_ID_TMF",            "61590681898786")
          set_secret("FB_PAGE_ACCESS_TOKEN_MZ",  "EAAXbI32B6G4BRtWVTJPn6oJUpFBtgM1L81WXgnmdb9i8hdOZC0ZBH1Xo5vZCdBW9XmAB7R8mBITxQ74fWgmeUZA9rQ0fuhU3ag5e8wovjjROpoeOvjjbNK1ipqSBnXxtmDfuHCNpr2AVzylyrM6oeXEobnFqqLpa8Bi6Ctk8sxUCwP9kzJfhAshmKXL0ZCsOeCfAUNFyvIN1yi9Q59pJEuM3t5Eg9IGWj05Av5bao5HTyoCoCcRHhuqZCTZCWuEb3zZCKMx2rA2AjwHoB34ZD")
          set_secret("FB_PAGE_ID_MZ",            "61590755935661")
          print("Done!")
          PYEOF
