name: YouTube Auto-Post - Minute Zero

on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      format:
        description: 'Force format (A|B|C). Leave blank for auto-rotation.'
        required: false
        default: ''
      topic:
        description: 'Override topic string (optional).'
        required: false
        default: ''
      dry_run:
        description: 'Render only, skip YouTube upload.'
        required: false
        default: 'false'

jobs:
  autopost-mz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts Pillow openai anthropic requests \
            google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Create YouTube token file
        run: |
          echo '${{ secrets.YT_TOKEN_MZ }}' > youtube_token_mz.json

      - name: Run Minute Zero auto-post
        env:
          MZ_MODEL_BACKEND: openai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY:   ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY:   ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
          MZ_VOICE:         ${{ vars.MZ_VOICE || 'en-US-ChristopherNeural' }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.format }}" ]; then
            ARGS="--format ${{ github.event.inputs.format }}"
          fi
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            ARGS="$ARGS --topic \"${{ github.event.inputs.topic }}\""
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: python3 auto_post_mz.py $ARGS"
          eval "python3 auto_post_mz.py $ARGS"
        continue-on-error: true

      - name: Post Facebook Reel (MZ)
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN_MZ }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID_MZ }}
          FB_TRIGGER_GLOB: "auto_trigger_mz_*.json"
        run: |
          pip install requests -q
          python3 fb_yt_crosspost.py
        continue-on-error: true

      - name: Commit results
        run: |
          git config --local user.email "automation@youtube.local"
          git config --local user.name "YouTube AutoPost Bot"
          git pull --rebase origin main || true
          git add mz_post_log.json auto_post_log.json auto_trigger_mz_*.json pexels_used_mz.json 2>/dev/null || true
          git commit -m "Auto-post video (MZ) - $(date)" || true
          git push || true

      - name: Upload logs to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mz-autopost-logs
          path: |
            auto_post_log.json
            auto_trigger_mz_*.json
          retention-days: 7
