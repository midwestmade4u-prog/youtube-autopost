name: YouTube Auto-Post - Minute Zero

on:
  schedule:
    # Jul 5 2026: 1x/day, every day (7/wk) -- Matt wants a daily-minimum floor
    # per channel. Dropped the evening slot (was 14/wk) but kept full 7-day
    # coverage rather than the analytics-review's suggested Mon/Wed/Fri/Sun cut.
    - cron: '23 14 * * *'
  workflow_dispatch:
    inputs:
      format:
        description: 'Force format (A|B|C).'
        required: false
        default: ''
      topic:
        description: 'Override topic string.'
        required: false
        default: ''
      dry_run:
        description: 'Render only, skip upload.'
        required: false
        default: 'false'

jobs:
  autopost-mz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "edge-tts==7.2.8" Pillow openai anthropic requests \
            google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Create YouTube token file
        run: |
          echo '${{ secrets.YT_TOKEN_MZ }}' > youtube_token_mz.json

      - name: Run Minute Zero auto-post
        env:
          MZ_MODEL_BACKEND: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY:   ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY:   ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
          MZ_VOICE:         ${{ vars.MZ_VOICE || 'en-US-ChristopherNeural' }}
        run: |
          ARGS=""
          # Aug 29 2026: format used to be derived from the runner's wall clock.
          # Actions began firing 6-10h late on Aug 27, pushing this run past noon
          # CT, and pick_format_for_slot() then silently chose Format B/C. Three
          # consecutive MZ posts consumed B/C while the 92-topic Format A bank
          # sat idle. A scheduled run must use the slot its cron names: MZ has
          # exactly one cron, 14:00 UTC = 09:00 CT, which is the Format A slot.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--format A"
          fi
          [ -n "${{ github.event.inputs.format }}" ] && ARGS="--format ${{ github.event.inputs.format }}"
          [ -n "${{ github.event.inputs.topic }}" ]  && ARGS="$ARGS --topic \"${{ github.event.inputs.topic }}\""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          eval "python3 auto_post_mz.py $ARGS"

      - name: Find video file
        run: |
          MP4=$(find MZ_Output -name "*_yt.mp4" 2>/dev/null | head -1)
          if [ -z "$MP4" ] || [ ! -f "$MP4" ]; then
            echo "No MP4 found — skipping FB upload"
            echo "FB_VIDEO_PATH=" >> $GITHUB_ENV
          else
            echo "Newest MZ mp4: $MP4"
            echo "FB_VIDEO_PATH=$MP4" >> $GITHUB_ENV
          fi

      - name: Post Facebook video (MZ)
        if: env.FB_VIDEO_PATH != ''
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN_MZ }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID_MZ }}
          FB_POST_LOG: "mz_post_log.json"
        run: |
          pip install requests -q
          python3 fb_yt_crosspost.py
        continue-on-error: true

      - name: Commit results
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --local user.email "automation@youtube.local"
          git config --local user.name "YouTube AutoPost Bot"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/midwestmade4u-prog/youtube-autopost.git
          git add mz_post_log.json auto_post_log.json auto_trigger_mz_*.json pexels_used_mz.json 2>/dev/null || true
          git diff --cached --quiet && echo "Nothing to commit, skipping" && exit 0
          # Fixed Jul 19 2026: previously did `git pull --no-rebase -X ours`
          # AFTER committing, then `git push` with no error handling. `-X ours`
          # resolves any real merge conflict by keeping OUR side of the hunk
          # and discarding theirs -- since mz_post_log.json/auto_post_log.json
          # are re-dumped with json.dumps(indent=2) on every write, almost any
          # concurrent edit reflows enough of the file to conflict, so "ours"
          # could silently erase a previously-logged dedup entry (a real
          # candidate for the Toys R Us repost from the Jul 19 2026 weekly
          # review, on top of the punctuation-matching bug fixed in
          # auto_post_mz.py the same day). Now: real rebase (never discards
          # the other side's entries) with retry, and a loud failure instead
          # of a silent one if it still can't land.
          git commit -m "Auto-post log (MZ) - $(date)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed dedup-log commit on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent run) -- retrying"
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 15) + 5 ))
          done
          echo "::error::MZ dedup-log commit FAILED to push after 5 attempts -- this run's post will NOT be recorded and may repeat."
          exit 1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mz-autopost-logs
          path: |
            auto_post_log.json
            auto_trigger_mz_*.json
          retention-days: 7
