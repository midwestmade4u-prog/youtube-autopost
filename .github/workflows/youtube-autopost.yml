name: YouTube Auto-Post - Bible Story Garden

# DISABLED Jul 5 2026: this workflow was duplicate-posting BSG content alongside
# bsg-autopost.yml (this ran 1x/day + bsg-autopost.yml ran 2x/day = 3 trigger points/day,
# ~21/wk actual vs 7/wk expected). bsg-autopost.yml is now the sole canonical BSG
# poster (it also has the FB crosspost step + GH_PAT log persistence this file lacks).
# Schedule trigger removed; workflow_dispatch kept for manual/emergency use only.
on:
  workflow_dispatch:

jobs:
  autopost-bsg:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask edge-tts Pillow openai google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Create config.json
        run: |
          cat > config.json << 'INNEREOF'
          {
            "openai_api_key": "${{ secrets.OPENAI_API_KEY }}",
            "elevenlabs_api_key": "${{ secrets.ELEVENLABS_API_KEY }}",
            "fal_api_key": "${{ secrets.FAL_API_KEY }}"
          }
          INNEREOF

      - name: Create YouTube token files
        env:
          YT_TOKEN_BSG: ${{ secrets.YT_TOKEN_BSG }}
          YT_TOKEN_TMF: ${{ secrets.YT_TOKEN_TMF }}
        run: |
          # Use Python to write token files — handles special characters safely
          python3 -c "
          import os, json, sys
          for fname, var in [('youtube_token_bsg.json','YT_TOKEN_BSG'),('youtube_token_tmf.json','YT_TOKEN_TMF')]:
              val = os.environ.get(var,'')
              if not val:
                  print(f'WARNING: {var} is empty')
                  continue
              try:
                  parsed = json.loads(val)
                  with open(fname,'w') as f:
                      json.dump(parsed, f)
                  print(f'OK: {fname} written ({len(parsed)} keys)')
              except Exception as e:
                  print(f'ERROR: {fname} — {e}')
                  sys.exit(1)
          "

      # BSG re-enabled May 5 2026. Token must be generated under midwestmade4u@gmail.com
      # selecting Bible Story Garden brand account. bsgchannel99 is manager only — never token source.
      # Disabled Jul 5 2026 -- bsg-autopost.yml is now the sole BSG poster (see top-of-file note).
      - name: Run Bible Story Garden auto-post
        if: false
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
          YT_TOKEN_BSG: ${{ secrets.YT_TOKEN_BSG }}
        run: python3 auto_post.py --channel bsg
        continue-on-error: true

      # TMF is now handled exclusively by tmf-autopost.yml (dedicated workflow).
      # Disabled here to prevent double-posting. Do not re-enable.
      - name: Run The Mind Files auto-post
        if: false
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
        run: python3 auto_post.py --channel tmf
        continue-on-error: true

      - name: Commit results
        run: |
          git config --local user.email "automation@youtube.local"
          git config --local user.name "YouTube AutoPost Bot"
          git pull --rebase origin main || true
          git add bsg_post_log.json auto_post_log.json auto_trigger_*.json 2>/dev/null || true
          git commit -m "Auto-post videos (BSG) - $(date)" || true
          git push || true

      - name: Upload logs to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopost-logs
          path: |
            watcher.log
            auto_post_log.json
          retention-days: 7
