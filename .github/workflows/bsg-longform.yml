name: BSG Long-Form Auto-Post

# Runs Sun 10AM / Tue 9AM / Fri 12PM CT — optimized schedule per Buffer 1.8M video study
# Generates, renders, and uploads a public 7–9 min YouTube video for Bible Story Garden.
# Matt receives an email confirming what posted.

# RETIRED 2026-08-30 -- see bsg-autopost.yml. Schedule removed; manual only.
# To resume, restore:
#   schedule:
#     - cron: '0 15 * * 0'   # Sunday    10 AM CT
#     - cron: '0 14 * * 2'   # Tuesday    9 AM CT
#     - cron: '0 17 * * 5'   # Friday    12 PM CT
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Override topic string (leave blank for auto-pick)'
        required: false
        default: ''
      dry_run:
        description: 'Render only, skip upload (true/false)'
        required: false
        default: 'false'

jobs:
  longform-bsg:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          # Install Oswald Bold for thumbnails (with fallback)
          sudo mkdir -p /usr/local/share/fonts
          curl -sL --retry 3 --max-time 30 \
            "https://fonts.gstatic.com/s/oswald/v53/TK3_WkUHHAIjg75cFRf3bXL8LICs13NvgUFoZAaRliE.ttf" \
            -o /usr/local/share/fonts/Oswald-Bold.ttf || echo "Font download failed — will use fallback font"
          fc-cache -f || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "edge-tts==7.2.8" Pillow openai anthropic requests \
            google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Create YouTube token file
        run: |
          echo '${{ secrets.YT_TOKEN_BSG }}' > youtube_token_bsg.json

      - name: Run BSG Long-Form auto-post
        env:
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:          ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY:          ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_SHEETS_KEY:       ${{ secrets.GOOGLE_SHEETS_KEY }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          BSG_LONGFORM_VOICE:      ${{ vars.BSG_LONGFORM_VOICE || 'en-US-AndrewNeural' }}
          BSG_LONGFORM_PLAYLIST_ID: ${{ vars.BSG_LONGFORM_PLAYLIST_ID || 'PLWwJ5gjyjteowfCIsBJ-9UuoMd-12I3Jg' }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            ARGS="--topic \"${{ github.event.inputs.topic }}\""
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: python3 auto_post_bsg_longform.py $ARGS"
          eval "python3 auto_post_bsg_longform.py $ARGS"

      - name: Commit dedup log + post log
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --local user.email "automation@youtube.local"
          git config --local user.name "YouTube AutoPost Bot"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/midwestmade4u-prog/youtube-autopost.git
          git add auto_post_log.json bsg_longform_posted.json bsg_longform_queue.json pexels_used_bsg_longform.json 2>/dev/null || true
          git diff --cached --quiet && echo "Nothing to commit, skipping" && exit 0
          # Aug 24 2026: this step previously ended in a bare `git push || true`
          # with no credentials, so the BSG long-form dedup ledger NEVER
          # reached origin -- `git log --grep="long-form post"` returned zero
          # commits, and every run reloaded an empty ledger. That is why the
          # same story could publish repeatedly. Mirrors the hardened pattern
          # already used by bsg-autopost.yml: commit locally FIRST so a
          # rebase has something to replay, then retry pull+push, then fail LOUD.
          git commit -m "BSG long-form post - $(date)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed BSG long-form dedup-log commit on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent run) -- retrying"
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 15) + 5 ))
          done
          echo "::error::BSG long-form dedup-log commit FAILED to push after 5 attempts -- this post will NOT be recorded and the topic may repeat."
          exit 1

      - name: Upload logs to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsg-longform-logs
          path: |
            auto_post_log.json
          retention-days: 14
