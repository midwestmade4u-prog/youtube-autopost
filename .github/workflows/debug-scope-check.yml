name: Debug — Check Actual OAuth Scopes (diagnostic, run manually)
on:
  workflow_dispatch:

jobs:
  check-scopes:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Write YouTube token files
        run: |
          echo '${{ secrets.YT_TOKEN_TMF }}' > youtube_token_tmf.json
          echo '${{ secrets.YT_TOKEN_MZ }}' > youtube_token_mz.json

      - name: Check what scopes Google actually granted (not what we requested)
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, urllib.parse, urllib.error

          def check(label, token_file):
              print(f"\n=== {label} ({token_file}) ===")
              d = json.load(open(token_file))
              print("  requested/local scopes:", d.get("scopes"))
              data = urllib.parse.urlencode({
                  "client_id": d["client_id"],
                  "client_secret": d["client_secret"],
                  "refresh_token": d["refresh_token"],
                  "grant_type": "refresh_token",
              }).encode()
              req = urllib.request.Request("https://oauth2.googleapis.com/token", data=data)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      tok = json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  print("  REFRESH FAILED:", e.code, e.read().decode()[:500])
                  return
              access_token = tok.get("access_token")
              print("  refresh_response scope field:", tok.get("scope", "(none returned)"))
              info_req = urllib.request.Request(
                  "https://oauth2.googleapis.com/tokeninfo?access_token=" + access_token
              )
              try:
                  with urllib.request.urlopen(info_req, timeout=20) as resp2:
                      info = json.loads(resp2.read())
                  print("  >>> ACTUAL GRANTED SCOPES (tokeninfo):", info.get("scope"))
                  print("  expires_in:", info.get("expires_in"))
              except urllib.error.HTTPError as e:
                  print("  TOKENINFO FAILED:", e.code, e.read().decode()[:500])

          check("TMF", "youtube_token_tmf.json")
          check("MZ", "youtube_token_mz.json")
          PYEOF
